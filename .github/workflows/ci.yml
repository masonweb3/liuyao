# PR 的必过检查（main 的 ruleset 要求 test 通过）。
# 不加 paths 过滤：被跳过的必过检查会让 PR 一直卡在「等待中」。
name: CI
on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm 版本取自 package.json 的 packageManager；装完自动 pnpm install --frozen-lockfile
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          require-lockfile: true
      - run: pnpm test
      - run: pnpm build
